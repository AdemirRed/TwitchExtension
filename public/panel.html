<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExplorarBot · Painel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="panel-container">

    <!-- Cabeçalho com título + role badge -->
    <div class="panel-header">
      <div class="panel-title">
        <div class="dot"></div>
        <h2 id="panel-title-text">ExplorarBot</h2>
      </div>
      <span class="role-badge viewer" id="role-badge">viewer</span>
    </div>

    <!-- Barra de abas -->
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="tab-cmds"     title="Comandos"    aria-label="Comandos">🎮</button>
      <button class="tab-btn"        data-tab="tab-canal"    title="Canal"       aria-label="Canal">📡</button>
      <button class="tab-btn"        data-tab="tab-poll"     title="Enquetes"    aria-label="Enquetes">🗳️</button>
      <button class="tab-btn"        data-tab="tab-pred"     title="Previsões"   aria-label="Previsões">🔮</button>
      <button class="tab-btn"        data-tab="tab-rewards"  title="Recompensas" aria-label="Recompensas">🪙</button>
    </nav>

    <!-- Conteúdo das abas -->
    <div class="tab-content">

      <!-- ABA 1: Comandos -->
      <div class="tab-pane active" id="tab-cmds" role="tabpanel">
        <div class="command-list" id="command-list">
          <p class="no-commands">Carregando comandos… ⏳</p>
        </div>
      </div>

      <!-- ABA 2: Canal -->
      <div class="tab-pane" id="tab-canal" role="tabpanel">
        <div class="canal-card" id="canal-info">
          <div class="game-name" id="canal-game">Carregando…</div>
          <div class="stream-title" id="canal-title">—</div>
          <div class="stat-row">
            <div class="stat-chip">
              <div class="val" id="stat-viewers">—</div>
              <div class="lbl">👁 viewers</div>
            </div>
            <div class="stat-chip">
              <div class="val" id="stat-subs">—</div>
              <div class="lbl">💜 subs</div>
            </div>
            <div class="stat-chip">
              <div class="val" id="stat-uptime">—</div>
              <div class="lbl">⏱ uptime</div>
            </div>
          </div>
        </div>
        <div class="recent-alerts">Feed ao vivo</div>
        <div id="alert-feed"></div>
      </div>

      <!-- ABA 3: Enquetes -->
      <div class="tab-pane" id="tab-poll" role="tabpanel">
        <div id="poll-pane">
          <p class="no-poll">Nenhuma enquete ativa no momento.</p>
        </div>
      </div>

      <!-- ABA 4: Previsões -->
      <div class="tab-pane" id="tab-pred" role="tabpanel">
        <div id="pred-pane">
          <p class="no-poll">Nenhuma previsão ativa no momento.</p>
        </div>
      </div>

      <!-- ABA 5: Recompensas Channel Points -->
      <div class="tab-pane" id="tab-rewards" role="tabpanel">
        <div id="rewards-list">
          <p class="no-commands">Carregando recompensas… ⏳</p>
        </div>
      </div>

    </div>
  </div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="js/twitch-ext.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/polls.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
