<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExplorarBot · Mobile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mobile-container">

    <!-- Header -->
    <div class="mobile-header">
      <div class="mobile-header-left">
        <div class="dot"></div>
        <span id="mobile-channel">ExplorarBot</span>
      </div>
      <span class="role-badge viewer" id="mobile-role-badge">viewer</span>
    </div>

    <!-- Mini Poll (oculta por padrão) -->
    <div id="mini-poll-container" style="display:none"></div>

    <!-- Seção: Comandos -->
    <div class="mobile-section-title">🎮 Comandos</div>
    <div class="cmd-grid" id="cmd-grid"></div>

    <!-- Seção: Recompensas Channel Points -->
    <div class="mobile-section-title" id="rewards-section-title" style="display:none">🪙 Recompensas do Canal</div>
    <div class="cmd-grid" id="rewards-grid" style="display:none"></div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="js/twitch-ext.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/polls.js"></script>
  <script>
    const BACKEND = 'https://explorarbot.up.railway.app';
    const grid       = document.getElementById('cmd-grid');
    const rewardsGrid = document.getElementById('rewards-grid');
    const toast       = document.getElementById('toast');
    let toastTimer, auth = null;

    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ── Role badge ──
    function setRoleBadge(role) {
      const el = document.getElementById('mobile-role-badge');
      const map = {
        broadcaster: { label: '🎮 Streamer', cls: 'mod' },
        moderator:   { label: '🔨 Mod',      cls: 'mod' },
        subscriber:  { label: '💜 Sub',      cls: 'sub' },
        vip:         { label: '⭐ VIP',      cls: 'vip' },
        viewer:      { label: '👁 Viewer',   cls: 'viewer' },
      };
      const def = map[role] || map.viewer;
      el.textContent = def.label;
      el.className = `role-badge ${def.cls}`;
    }

    // ── Renderizar comandos ──
    function renderCmds(cmds, rewardMap) {
      grid.innerHTML = '';
      cmds.forEach(({ cmd, emoji, desc, perm }) => {
        const pts = rewardMap?.[cmd];
        const card = document.createElement('div');
        card.className = 'cmd-card';
        card.id = `cmd-card-${cmd.replace(/[^a-z0-9]/gi, '')}`;
        card.innerHTML = `
          ${pts ? `<span class="pts-chip">🪙${pts.toLocaleString('pt-BR')}</span>` : ''}
          <span class="icon">${emoji || '🎮'}</span>
          <div class="name">${escHtml(cmd)}</div>
          <div class="desc">${escHtml(desc || perm || '')}</div>
        `;
        card.onclick = () => {
          showToast(`${emoji || ''} ${cmd} enviado!`);
          TwitchExt.send('broadcast', 'application/json', JSON.stringify({
            type: 'command', cmd, user: auth?.userId || 'mobile_user'
          }));
        };
        grid.appendChild(card);
      });
    }

    // ── Renderizar recompensas de Channel Points ──
    function renderRewards(rewards) {
      if (!rewards?.length) return;
      rewardsGrid.style.display = 'grid';
      document.getElementById('rewards-section-title').style.display = 'block';
      rewardsGrid.innerHTML = '';
      rewards.forEach(r => {
        const card = document.createElement('div');
        card.className = 'cmd-card';
        card.id = `reward-card-${r.id || r.title?.replace(/\s/g, '')}`;
        card.innerHTML = `
          <span class="pts-chip">🪙${(r.cost || 0).toLocaleString('pt-BR')}</span>
          <span class="icon">${r.icon || '🪙'}</span>
          <div class="name" style="font-size:10px">${escHtml(r.title)}</div>
        `;
        card.onclick = () => showToast(`🪙 ${r.title} — resgate no chat!`);
        rewardsGrid.appendChild(card);
      });
    }

    // ── PubSub para poll mobile ──
    function conectarPubSub() {
      TwitchExt.listen('broadcast', (target, contentType, raw) => {
        let msg;
        try { msg = JSON.parse(raw); } catch { return; }
        if (['poll_create','poll_update','poll_complete'].includes(msg.type)) {
          PollsSystem.onPollEvent({ type: msg.type, data: msg.data || msg });
        }
        if (['sub','cheer','raid'].includes(msg.type) && navigator.vibrate) {
          navigator.vibrate(msg.type === 'raid' ? [200,100,200] : 80);
        }
      });
    }

    // ── Init ──
    PollsSystem.setMiniPollEl(document.getElementById('mini-poll-container'));

    TwitchExt.onAuthorized(a => {
      auth = a;
      setRoleBadge(TwitchExt.getViewer().role);

      fetch(`${BACKEND}/api/extension/${a.channelId}/commands`)
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            if (data.canal) document.getElementById('mobile-channel').textContent = data.canal;
            renderCmds(data.commands || [], data.reward_map);
            renderRewards(data.rewards || []);
          }
        })
        .catch(() => {
          renderCmds([
            { cmd: '!hidrate', emoji: '💧', desc: 'Beber água' },
            { cmd: '!hype',    emoji: '🔥', desc: 'Hype!' },
          ]);
        });

      conectarPubSub();
    });

    function escHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
      );
    }
  </script>
</body>
</html>
