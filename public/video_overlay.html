<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ExplorarBot · Overlay</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: transparent; }

    /* Dev tools */
    #dev-tools {
      display: none;
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: column;
      gap: 5px;
      background: rgba(0,0,0,.75);
      padding: 8px 12px;
      border-radius: 10px;
      z-index: 9999;
      max-width: 340px;
    }
    #dev-tools p { font-size: 9px; color: #5a5a64; text-align: center; margin-bottom: 2px; }
    .dev-row { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
    #dev-tools button {
      background: #1f1f23;
      border: 1px solid #9147ff;
      color: #efeff1;
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
    }
    #dev-tools button:hover { background: #2a2a2d; }
  </style>
</head>
<body>
  <div class="overlay-container">

    <!-- Barra do Hype Train (topo) -->
    <div class="hype-train-bar hidden" id="hype-train-bar">
      <div class="hype-train-fill" id="hype-train-fill" style="width:0%"></div>
    </div>
    <div class="hype-train-badge hidden" id="hype-train-badge">🚂 HYPE TRAIN</div>

    <!-- Camada de efeito central (comandos de chat) -->
    <div class="effect-layer" id="effect-layer">
      <span class="effect-text" id="effect-text"></span>
    </div>

    <!-- Stack de alertas (canto superior direito) -->
    <div class="alert-stack" id="alert-stack"></div>

  </div>

  <!-- Dev Tools (apenas modo local) -->
  <div id="dev-tools">
    <p>DEV — simular eventos</p>
    <div class="dev-row">
      <button data-cmd="!hidrate">💧 !hidrate</button>
      <button data-cmd="!alongar">🧘 !alongar</button>
      <button data-cmd="!skill">💀 !skill</button>
      <button data-cmd="!hype">🔥 !hype</button>
      <button data-cmd="!lurk">👻 !lurk</button>
    </div>
    <div class="dev-row">
      <button data-alert="sub">💜 Sub</button>
      <button data-alert="resub">💜 Resub</button>
      <button data-alert="gift">🎁 Gift</button>
      <button data-alert="cheer">💎 Cheer</button>
      <button data-alert="raid">🚀 Raid</button>
      <button data-alert="pts">🪙 Ch.Pts</button>
    </div>
    <div class="dev-row">
      <button data-hype="start">🚂 Hype start</button>
      <button data-hype="progress">📈 Hype +30%</button>
      <button data-hype="end">🎉 Hype end</button>
    </div>
  </div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="js/twitch-ext.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/hype-train.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
